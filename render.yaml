databases:
  - name: geoharmonize-postgis-db
    databaseName: geoharmonize
    user: geoharmonize
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  # Django REST Framework backend
  - type: web
    name: geoharmonize-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geoharmonize-postgis-db
          property: connectionString

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,geoharmonize-backend-8b1m.onrender.com,localhost,127.0.0.1"

      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"

      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://geoharmonize-xi.vercel.app"

      - key: CSRF_TRUSTED_ORIGINS
        value: "http://localhost:5173,https://geoharmonize-xi.vercel.app,https://geoharmonize-backend-8b1m.onrender.com"

      - key: FRONTEND_URL
        value: "https://geoharmonize-xi.vercel.app"

      - key: PROJECT_TARGET_CRS
        value: "EPSG:32644"

      - key: WEB_CONCURRENCY
        value: "1"

      - key: GUNICORN_TIMEOUT
        value: "120"
