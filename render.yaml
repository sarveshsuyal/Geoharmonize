
databases:
  - name: geoharmonize-postgis-db
    databaseName: geoharmonize
    user: geoharmonize
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  # Django REST Framework backend
  - type: web
    name: geoharmonize-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health/
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geoharmonize-postgis-db
          property: connectionString

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"

      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"

      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://your-frontend.vercel.app"

      - key: CSRF_TRUSTED_ORIGINS
        value: "http://localhost:5173,https://your-frontend.vercel.app"

      - key: FRONTEND_URL
        value: "https://your-frontend.vercel.app"

      - key: PROJECT_TARGET_CRS
        value: "EPSG:32644"

      - key: WEB_CONCURRENCY
        value: "1"

      - key: GUNICORN_TIMEOUT
        value: "120"

  # Optional Render-hosted frontend.
  # Keep this if you want Render to host a frontend copy as well.
  - type: web
    name: geoharmonize-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        value: https://geoharmonize-backend.onrender.com/api
