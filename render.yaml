services:
  # Django REST Framework backend with Supabase PostgreSQL + PostGIS
  - type: web
    name: geoharmonize-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health/
    autoDeploy: true

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_DEBUG
        value: "False"

      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,geoharmonize-backend-8b1m.onrender.com,localhost,127.0.0.1"

      - key: CORS_ALLOW_ALL_ORIGINS
        value: "False"

      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,https://geoharmonize-xi.vercel.app"

      - key: CSRF_TRUSTED_ORIGINS
        value: "http://localhost:5173,https://geoharmonize-xi.vercel.app,https://geoharmonize-backend-8b1m.onrender.com"

      - key: FRONTEND_URL
        value: "https://geoharmonize-xi.vercel.app"

      - key: PROJECT_TARGET_CRS
        value: "EPSG:32644"

      - key: WEB_CONCURRENCY
        value: "1"

      - key: GUNICORN_TIMEOUT
        value: "120"
